[project]
name = "banking-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "sqlalchemy>=2.0.36,<2.1", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26", "pyyaml>=6,<7", "jsonschema[format]>=4.23,<5",
]
[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "httpx>=0.28,<1", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-PyYAML>=6", "openapi-spec-validator>=0.7,<0.8", "pip-audit>=2.8,<3"]
[tool.uv]
package = false
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
files = ["banking"]
[tool.coverage.run]
branch = true
source = ["banking"]
[tool.coverage.report]
show_missing = true
