components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: bank_session
  schemas:
    Amount:
      type: string
      pattern: ^[1-9][0-9]*$
      maxLength: 19
      description: VND nguyên đồng, <=9223372036854775807, kiểm tra overflow cả kết quả ghi sổ.
    Balance:
      type: string
      pattern: ^(0|[1-9][0-9]*)$
      maxLength: 19
    Role:
      type: string
      enum:
      - customer
      - teller
      - fraud_analyst
      - admin
    Location:
      type: object
      additionalProperties: false
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
      required:
      - latitude
      - longitude
    ErrorDetail:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
      required:
      - field
      - code
      - message
    ErrorBody:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        request_id: *id002
      required:
      - code
      - message
      - details
      - request_id
    Error:
      type: object
      additionalProperties: false
