openapi: 3.1.0
info:
  title: Banking Demo API
  version: 0.1.0-design
  description: Canonical contract, design checkpoint; no running API yet. Ownership and business semantics in backend/design.
    Money is digit-string VND; UTC timestamps. All authenticated mutations require exact Origin and session-bound X-CSRF-Token.
    Role list does not override resource ownership.
servers:
- url: http://localhost:8080
  description: Local full-stack demo; /api/v1 is included in paths.
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      summary: login
      tags:
      - auth
      x-roles: []
      security: []
      responses:
        '200':
          description: Thành công. Lệnh tiền có thể đang chờ duyệt; đọc status trước khi hiển thị đã ghi sổ.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
          headers:
            Set-Cookie:
              schema:
                type: string
              description: bank_session opaque; HttpOnly; SameSite=Lax; Secure ngoài local development; token không nằm trong
                JSON.
        '401':
          description: Chưa đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không đủ quyền hoặc CSRF/Origin sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tồn tại/ngoài phạm vi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict/số dư/trạng thái/key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Input không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
        '500':
          description: Lỗi ngoài dự kiến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Lỗi tạm thời, rollback nếu chưa commit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
